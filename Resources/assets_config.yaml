# assets_manifest.yaml
Config:
  Asset:
    BaseIndex:
      index:
        - "ShaderAsset"
        - "TextureAsset"
        - "MeshAsset"
        - "SkyboxAsset"
    Index:
      index:
        - "TextureGrassDiffuse"
        - "MeshSimpleCube"
        - "DefaultSkybox"
    ShaderTextUI:
        type: "ShaderAsset"
        shader_path: "C:\\Users\\joaqu\\source\\repos\\DirectX-Voxelado\\Assets\\Shaders\\TextShader.hlsl" # Ruta al shader si lo gestionamos como asset
    TextureTextUI:
        type: "TextureAsset"
        file_path: "C:\\Users\\joaqu\\source\\repos\\DirectX-Voxelado\\Assets\\Textures\\UI\\DejaVuSansMono.jpg"
        srgb: true # Propiedad específica de textura
    TextureGrassDiffuse:
      type: "TextureAsset"
      file_path: "Assets/Textures/grass_diffuse.png"
      srgb: true # Propiedad específica de textura
    SkyboxCube:
      type: "MeshAsset"
      # file_path: "Assets/Meshes/simple_cube.obj" # O un formato procesado .bin
      has_normals: true
      has_indices: true
      has_tangents: false
      has_uvs: false
      has_colors: false
      has_bones: false
    DefaultShader:
      type: "ShaderAsset"
      shader_path: "Assets/Shaders/TextureShader.hlsl" # Ruta al shader si lo gestionamos como asset
    DefaultSkybox:
      type: "SkyboxAsset"
      cubemap_path: "C:\\Users\\joaqu\\source\\repos\\DirectX-Voxelado\\Assets\\Skybox\\defaultSkybox.dds"
      mesh_name: "SkyboxCube"
      shader_name: "DefaultShader" # Referencia a un shader si los gestionamos como assets
      rotation_speed: 0.05 # Propiedad específica del skybox
Interface:
    DefaultSkyboxConfig: 
        - "IAssetSkyboxConfig"
    DefaultShaderConfig: 
        - "IAssetShaderConfig"
    SkyboxCubeConfig:
        - "IAssetMeshConfig"
Template:
    SkyboxCubeConfig:
        - "VertexDefinition::SimpleVertex"