      interface_name: "IPipelineShaderViewState"

    ViewportMainColor:
      interface_name: "IPipelineViewportState"
    ViewportShadow:
      interface_name: "IPipelineViewportState"
    ViewportUI:
      interface_name: "IPipelineViewportState"

