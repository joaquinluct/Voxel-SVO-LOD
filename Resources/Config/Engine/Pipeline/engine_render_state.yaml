# engine_render_state.yaml
Config:
  Base:
    Pipeline:
      RenderStates:
        BackBufferMain:
          Type: D3D11_TEXTURE2D_DESC
          Width: 0 #width;
          Height: 0 #height;
          MipLevels: 1 #1;
          ArraySize: 1 #1;
          Format: 28 #DXGI_FORMAT_R8G8B8A8_UNORM;
          SampleDescCount: 1 #1;
          SampleDescQuality: 0 #0;
          Usage: 0 #D3D11_USAGE_DEFAULT;
          BindFlags: 32 #D3D11_BIND_RENDER_TARGET;
          CPUAccessFlags: 0 #0;
          MiscFlags: 0 #0;

        DepthBufferMain:
          Type: D3D11_TEXTURE2D_DESC
          Width: 0 #width;
          Height: 0 #height;
          MipLevels: 1 #1;
          ArraySize: 1 #1;
          Format: 45 #DXGI_FORMAT_D24_UNORM_S8_UINT;
          SampleDescCount: 1 #1;
          SampleDescQuality: 0 #0;
          Usage: 0 #D3D11_USAGE_DEFAULT;
          BindFlags: 64 #D3D11_BIND_DEPTH_STENCIL;
          CPUAccessFlags: 0 #0;
          MiscFlags: 0 #0;

        RasterizedMainColorPass:
          name: "RasterizedMainColorPass"
          FillMode: 3 #D3D11_FILL_SOLID
          CullMode: 3 #D3D11_CULL_BACK
          FrontCounterClockwise: false
          DepthBias: 0
          DepthBiasClamp: 0.0
          SlopeScaledDepthBias: 0.0
          AntialiasedLineEnable: true
          DepthClipEnable: true
          ScissorEnable: true
          MultisampleEnable: true
        RasterizedShadowPass:
          name: "RasterizedShadowPass"
          FillMode: 3 #D3D11_FILL_SOLID
          CullMode: 2 #D3D11_CULL_FRONT
          FrontCounterClockwise: false
          DepthBias: 50
          DepthBiasClamp: 0.0
          SlopeScaledDepthBias: 1.0
          AntialiasedLineEnable: false
          DepthClipEnable: true
          ScissorEnable: false
          MultisampleEnable: false
        RasterizedUIPass:
          name: "RasterizedUIPass"
          FillMode: 3 #D3D11_FILL_SOLID
          CullMode: 1 #D3D11_CULL_NONE
          FrontCounterClockwise: false
          DepthBias: 0
          DepthBiasClamp: 0.0
          SlopeScaledDepthBias: 0.0
          AntialiasedLineEnable: false
          DepthClipEnable: false
          ScissorEnable: false
          MultisampleEnable: false
        # Nuevo estado de rasterización para el reflejo del agua
        # RasterizedReflectedPass:
        #   name: "RasterizedReflectedPass"
        #   FillMode: 3
        #   CullMode: 2
        #   FrontCounterClockwise: false
        #   DepthBias: 0
        #   DepthBiasClamp: 0.0
        #   SlopeScaledDepthBias: 0.0
        #   AntialiasedLineEnable: true
        #   DepthClipEnable: true
        #   ScissorEnable: true
        #   MultisampleEnable: true

        DisabledBlending:
          TYPE: D3D11_BLEND_DESC
          AlphaToCoverageEnable: false
          IndependentBlendEnable: false
          BlendEnable: false #FALSE;
          SrcBlend: 1 #D3D11_BLEND_ONE;
          DestBlend: 1 #D3D11_BLEND_ZERO;
          BlendOp: 1 #D3D11_BLEND_OP_ADD;
          SrcBlendAlpha: 1 #D3D11_BLEND_ONE;
          DestBlendAlpha: 1 #D3D11_BLEND_ZERO;
          BlendOpAlpha: 1 #D3D11_BLEND_OP_ADD;
          RenderTargetWriteMask: 15 #D3D11_COLOR_WRITE_ENABLE_ALL;
        BlendingUI:
          AlphaToCoverageEnable: false
          IndependentBlendEnable: false
          BlendEnable: true  #TRUE;
          SrcBlend: 5 #D3D11_BLEND_SRC_ALPHA;
          DestBlend: 6 #D3D11_BLEND_INV_SRC_ALPHA;
          BlendOp: 1 #D3D11_BLEND_OP_ADD;
          SrcBlendAlpha: 2 #D3D11_BLEND_ONE;
          DestBlendAlpha: 1 #D3D11_BLEND_ZERO;
          BlendOpAlpha: 1 #D3D11_BLEND_OP_ADD;
          RenderTargetWriteMask: 15 #D3D11_COLOR_WRITE_ENABLE_ALL;
        # Nuevo estado de blending para el agua (transparencia)
        BlendingWaterPass:
          AlphaToCoverageEnable: false
          IndependentBlendEnable: false
          BlendEnable: true
          SrcBlend: 5 #D3D11_BLEND_SRC_ALPHA;
          DestBlend: 6 #D3D11_BLEND_INV_SRC_ALPHA;
          BlendOp: 1 #D3D11_BLEND_OP_ADD;
          SrcBlendAlpha: 5 #D3D11_BLEND_SRC_ALPHA;
          DestBlendAlpha: 6 #D3D11_BLEND_INV_SRC_ALPHA;
          BlendOpAlpha: 1 #D3D11_BLEND_OP_ADD;
          RenderTargetWriteMask: 15 #D3D11_COLOR_WRITE_ENABLE_ALL;

        StencilViewMainColor:
          Type: D3D11_DEPTH_STENCIL_VIEW_DESC
          StencilEnable: true
          DepthEnable: true
          DepthWriteMask: 1 #D3D11_DEPTH_WRITE_MASK_ALL;
          MipLevels: 1
          ArraySize: 1
          Format: 45 #DXGI_FORMAT_D24_UNORM_S8_UINT;
          SampleCount: 1
          SampleQuality: 0
          Usage: 0 #D3D11_USAGE_DEFAULT;
          BindFlags: 64 #D3D11_BIND_DEPTH_STENCIL;
          Depth: 1.0
          Stencil: 0.0
          ViewDesc: false
        StencilViewTerrain:
          Type: D3D11_DEPTH_STENCIL_VIEW_DESC
          StencilEnable: true
          DepthEnable: true
          DepthWriteMask: 1 #D3D11_DEPTH_WRITE_MASK_ALL;
          MipLevels: 1
          ArraySize: 1
          Format: 45 #DXGI_FORMAT_D24_UNORM_S8_UINT;
          SampleCount: 1
          SampleQuality: 0
          Usage: 0 #D3D11_USAGE_DEFAULT;
          BindFlags: 64 #D3D11_BIND_DEPTH_STENCIL;
          Depth: 1.0
          Stencil: 0.0
          ViewDesc: false
        StencilViewShadow:
          Type: D3D11_DEPTH_STENCIL_VIEW_DESC
          ClearFlags: 3 #D3D11_CLEAR_DEPTH | D3D11_CLEAR_STENCIL;
          StencilEnable: true
          DepthEnable: true
          DepthWriteMask: 1 #D3D11_DEPTH_WRITE_MASK_ALL;
          MipLevels: 1
          ArraySize: 1
          Format: 44
          SampleCount: 1
          SampleQuality: 0
          Usage: 0
          BindFlags: 72
          Depth: 1.0
          Stencil: 0.0
          Width: 2048.0
          Height: 2048.0
          ViewDesc: true
          ViewFormat: 45 #DXGI_FORMAT_D24_UNORM_S8_UINT;
          ViewDimension: 3 #D3D11_DSV_DIMENSION_TEXTURE2D
          ViewMipSlice: 0
          ShaderView: ShaderViewShadow

        StencilStateRegular:
          Type: D3D11_DEPTH_STENCIL_DESC
          DepthEnable: 1 # TRUE
          DepthWriteMask: 1 # D3D11_DEPTH_WRITE_MASK_ALL
          DepthFunc: 2 # D3D11_COMPARISON_LESS
          StencilEnable: 0 # FALSE
          StencilReadMask: 255 # D3D11_DEFAULT_STENCIL_READ_MASK (0xFF)
        StencilStateUI:
          Type: D3D11_DEPTH_STENCIL_DESC
          DepthEnable: 0 # FALSE
          DepthWriteMask: 0 # D3D11_DEPTH_WRITE_MASK_ZERO
          DepthFunc: 8 # D3D11_COMPARISON_ALWAYS
          StencilEnable: 0 # FALSE
          StencilReadMask: 255 # D3D11_DEFAULT_STENCIL_READ_MASK (0xFF)
          StencilWriteMask: 255 # D3D11_DEFAULT_STENCIL_WRITE_MASK (0xFF)

        ShaderViewShadow:
          Type: D3D11_SHADER_RESOURCE_VIEW_DESC
          Format:  46 #DXGI_FORMAT_R24_UNORM_X8_TYPELESS
          ViewDimension: 4 #D3D11_SRV_DIMENSION_TEXTURE2D
          MipLevels: 1
          MostDetailedMip: 0
        ShaderViewTexture2D:
          Type: D3D11_SHADER_RESOURCE_VIEW_DESC
          Format:  46 #DXGI_FORMAT_R24_UNORM_X8_TYPELESS
          ViewDimension: 4 #D3D11_SRV_DIMENSION_TEXTURE2D
          MipLevels: 1
          MostDetailedMip: 0
        ShaderViewTextureArray2D:
          Type: D3D11_SHADER_RESOURCE_VIEW_DESC
          Format: 28 #DXGI_FORMAT_R8G8B8A8_UNORM
          ViewDimension: 5 #D3D11_SRV_DIMENSION_TEXTURE2DARRAY
          Texture2DArrayMostDetailedMip: 0
          Texture2DArrayMipLevels: -1
          Texture2DArrayFirstArraySlice: 0
          Texture2DArrayArraySize: 12
        # Nueva vista de shader para la textura de reflejo
        ShaderViewReflection:
          Type: D3D11_SHADER_RESOURCE_VIEW_DESC
          Format: 28 #DXGI_FORMAT_R8G8B8A8_UNORM
          ViewDimension: 4 #D3D11_SRV_DIMENSION_TEXTURE2D
          MipLevels: 1
          MostDetailedMip: 0
        # Nueva vista de shader para la textura de refracción
        ShaderViewRefraction:
          Type: D3D11_SHADER_RESOURCE_VIEW_DESC
          Format: 28 #DXGI_FORMAT_R8G8B8A8_UNORM
          ViewDimension: 4 #D3D11_SRV_DIMENSION_TEXTURE2D
          MipLevels: 1
          MostDetailedMip: 0

        ViewportMainColor:
          MinDepth: 0.0
          MaxDepth: 1.0
          TopLeftX: 0.0
          TopLeftY: 0.0
          Width: 0.0
          Height: 0.0
        ViewportUI:
          MinDepth: 0.0
          MaxDepth: 1.0
          TopLeftX: 0.0
          TopLeftY: 0.0
          Width: 0.0
          Height: 0.0
        ViewportShadow:
          MinDepth: 0.0
          MaxDepth: 1.0
          TopLeftX: 0.0
          TopLeftY: 0.0
          Width: 2048.0
          Height: 2048.0
        # Nuevo viewport para reflejos/refracciones (normalmente a la resolución de la pantalla)
        ViewportWater:
          MinDepth: 0.0
          MaxDepth: 1.0
          TopLeftX: 0.0
          TopLeftY: 0.0
          Width: 0.0
          Height: 0.0

        Texture2D_Simple_Jpg:
          MipLevels: 1
          ArraySize: 1
          Format: 28 # DXGI_FORMAT_R8G8B8A8_UNORM // Assuming RGB
          SampleDescCount: 1
          SampleDescQuality: 0
          Usage: 1 # D3D11_USAGE_IMMUTABLE
          BindFlags: 8 # D3D11_BIND_SHADER_RESOURCE
          CPUAccessFlags: 0
          MiscFlags: 0
        Texture2D_Array_Jpg:
          MipLevels: 0          
          Format: 28 # DXGI_FORMAT_R8G8B8A8_UNORM // Assuming RGB
          SampleDescCount: 1
          SampleDescQuality: 0
          Usage: 0 # D3D11_USAGE_DEFAULT
          BindFlags: 40 # D3D11_BIND_SHADER_RESOURCE | D3D11_BIND_RENDER_TARGET
          CPUAccessFlags: 0
          MiscFlags: 1 # D3D11_RESOURCE_MISC_GENERATE_MIPS
        # Nueva textura 2D para la escena de reflejos
        Texture2D_WaterReflection:
          MipLevels: 1
          ArraySize: 1
          Format: 28 # DXGI_FORMAT_R8G8B8A8_UNORM
          SampleDescCount: 1
          SampleDescQuality: 0
          Usage: 0
          BindFlags: 104 # D3D11_BIND_SHADER_RESOURCE | D3D11_BIND_RENDER_TARGET
          CPUAccessFlags: 0
          MiscFlags: 0
        # Nueva textura 2D para la escena de refracción
        Texture2D_WaterRefraction:
          MipLevels: 1
          ArraySize: 1
          Format: 28 # DXGI_FORMAT_R8G8B8A8_UNORM
          SampleDescCount: 1
          SampleDescQuality: 0
          Usage: 0
          BindFlags: 104 # D3D11_BIND_SHADER_RESOURCE | D3D11_BIND_RENDER_TARGET
          CPUAccessFlags: 0
          MiscFlags: 0

