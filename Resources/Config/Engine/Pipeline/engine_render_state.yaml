    RasterizedShadowPass:
      interface_name: "IPipelineRasterizedState"
    RasterizedUIPass:
      interface_name: "IPipelineRasterizedState"

    DisabledBlending:
      interface_name: "IPipelineBlendingState"
    BlendingUI:
      interface_name: "IPipelineBlendingState"

