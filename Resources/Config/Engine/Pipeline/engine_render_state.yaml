      interface_name: "IPipelineTexture2DDesc"
    Texture2D_WaterReflection:
      interface_name: "IPipelineTexture2DDesc"
    Texture2D_WaterRefraction:
      interface_name: "IPipelineTexture2DDesc"

    BackBufferMain:
