    RasterizedMainColorPass:
      interface_name: "IPipelineRasterizedState"
    RasterizedShadowPass:
      interface_name: "IPipelineRasterizedState"
    RasterizedUIPass:
      interface_name: "IPipelineRasterizedState"
    RasterizedReflectedPass:
      interface_name: "IPipelineRasterizedState"

    DisabledBlending:
      interface_name: "IPipelineBlendingState"
    BlendingUI:
      interface_name: "IPipelineBlendingState"
    BlendingWaterPass:
      interface_name: "IPipelineBlendingState"

    StencilViewMainColor:
      interface_name: "IPipelineStencilView"
    StencilViewShadow:
      interface_name: "IPipelineStencilView"
    StencilViewTerrain:
      interface_name: "IPipelineStencilView"

    StencilStateRegular:
      interface_name: "IPipelineStencilState"
    StencilStateUI:
      interface_name: "IPipelineStencilState"

    ShaderViewShadow:
      interface_name: "IPipelineShaderViewState"
    ShaderViewTexture2D:
      interface_name: "IPipelineShaderViewState"
    ShaderViewTextureArray2D:
      interface_name: "IPipelineShaderViewState"
    ShaderViewReflection:
      interface_name: "IPipelineShaderViewState"
