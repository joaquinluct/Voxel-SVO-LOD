# geometry_engines.yaml
Config:
  Terrain:
    GeometryEngines:
      GeometryChunkEngine:
        name: "GeometryChunkEngine"
        enabled: true
        version: "1.0.0"            
        terrain_asset: ProceduralTerrain
        description: "Motor de geometría basado en chunks."
        dependencies:
            - DeviceManager
            - TerrainAsset
      TessellationGeometryEngine:
        name: "TessellationGeometryEngine"
        enabled: true
        version: "1.0.0"
        terrain_asset: ProceduralTerrain
        shader_name: "TerrainTessellation"
        description: "Motor de geometría que utiliza tessellation en GPU (HS/DS)."
        dependencies:
            - DeviceManager
            - ShaderManager
            - TerrainAsset
Definition:
  Default:
    language: 1 # C++
    type: "Class"
    needs_register: true
    file_level: 3
    register_include: "REGISTER_CONFIG_TYPE"
    register_macro: "REGISTER_CONFIG_MACRO"
    interface_name: "ConfigService"
    class_suffix: "Config"
    class_prefix: ""
    inherits_properties:
        - enabled
        - dependencies 
    output_path: 'c:\Users\joaqu\source\repos\DirectX-Voxelado\src\Engine\Core\Config\Game\'
