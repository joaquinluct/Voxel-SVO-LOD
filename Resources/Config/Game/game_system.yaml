Config:
  Game:
    System:
        World:
            name: "WorldMananger"
            enabled: true
            version: "1.0.0"
            description: "Un mundo abierto."
            gameType: 1 # Overworld
            gameFlags: 15 # Chronos | Terrain | Skybox | Biome
            # gameFlags: 3 # Chronos | Terrain
            # gameFlags: 1 # Chronos
            type: "VoxelWorld"
            respawnTime: 5
            dependencies:
              - Chronos
              - Terrain
              # - Skybox
              # - RenderManager
              - UITextMesh

        Renderer:
            name: "Renderer"
            enabled: true
            version: "1.0.0"
            type: "DeferredRendering"
            dependencies:
              - DeviceManager

        Terrain:
            name: Terrain
            enabled: true
            version: "1.0.0"            
            # seed: 1234567890
            # chunk_size: 128
            # initialRenderDistanceChunks: 80
            # worldWidth: 163840.0
            # worldHeight: 163840.0
            # terrainHeight: 3.164
            # waterLevel: -2.0

            # Cómo es el terreno: 23/3D finito/infinito
            type: 1 # 1: Finite3D (Definición en src\Engine\Core\Defines\WorldTerrain.h)
            # Cómo se genera la geometría: Chunk, voxel, dual-contorning, etc
            geometry_type: 1 # 1: Chunk (Definición en src\Engine\Core\Defines\WorldTerrain.h)
            # Cómo se distribuye el terreno: Chunk, OctTree, QuadTree, Tiles, ...
            terrain_distribution:  1 # Chunk
            # Como se genera el terreno: Fijo en disco duro, procedural, mápa de altura, ...
            terrain_generator: 2 # Procedural

            # Qué motor genera la geometría
            geometry_engine: GeometryChunkEngine
            # Qué motor generar el terreno
            terrain_engine:  TerrainChunkEngine


            procedural_engine: 1            # 1 = FastNoiseLite base | 2 = DoubleLayerNoiseEngine | 3 = ProceduralBiomes

            geometry_lod_strategy: "Distance"       # Distance | ScreenSpace | Manual | GPUDriven
            geometry_lod_thresholds: [0, 500, 1000, 2000, 4000]  # Opcional si strategy ≠ Manual
            geometry_lod_blending: true             # true = geomorphing
            
            generation_type: "Procedural"         # Fixed | HeightMap | Procedural
            generation_algorithm: 1               # 1 = FastNoiseLite | 2 = DoubleLayerNoise | 3 = BiomeEngine

            generation_frequency: 0.01            # Frecuencia base del ruido
            generation_amplitude: 1.0             # Altura máxima del terreno
            generation_octaves: 4                 # Número de capas de ruido
            generation_lacunarity: 2.0            # Separación entre octavas
            generation_gain: 0.5                  # Caída de amplitud por octava

            geometry_resolution: 1               # 1 = máxima | 2 = media | 3 = baja
            geometry_normals: true               # true = calcular normales | false = sin normales
            geometry_smooth: false               # true = suavizar normales | false = normales por cara

            spatial_structure: "Chunk"           # Chunk | QuadTree | Grid | RegionTree
            quad_tree_max_depth: 0               # Profundidad máxima del QuadTree (solo si spatial_structure = QuadTree)
            quad_tree_min_size: 0                # Tamaño mínimo por nodo (solo si QuadTree)
            quad_tree_lod_strategy: "None"       # None | Distance | ScreenSpace | Manual

            buffer_layout: "Unified"             # Unified | DistanceSplit | PerChunk | PerNode
            buffer_zones: 1                      # Número de zonas si se usa DistanceSplit
            dependencies:
              - ChunkService
              - CameraManager
              - ShaderManager
              - TerrainAsset
              - ProceduralTerrain
              - MeshAsset               
        Water:
            name: "Water"
            enabled: true
            version: "1.0.0"
            type: "BasicWater"
            waterLevel: -2.0
            waveIntensity: 0.5
            waveSpeed: 1.0
            dependencies:              
              - Terrain
        Skybox:
            name: "Skybox"
            enabled: true
            shadow_pass: false
            version: "1.0.0"
            type: "DefaultSkybox"
            mesh: "ProcSkyboxMesh"
            sky_color: [0.4, 0.4, 0.9, 1.0] # RGBA
            sun_color: [1.0, 0.9, 0.6, 1.0] # RGBA
            dependencies:
              - ProcSkyboxMesh
              - RenderManager
        Physics:
            name: "PhysicService"
            enabled: true
            version: "1.0.0"
            type: "BasicPhysics"
            properties:
            gravity: [0.0, -9.81, 0.0]

        Biome:
            name: "Biome"
            enabled: true
            version: "1.0.0"
            biome_type: 1 # Procedural
            ocean_level: 0.0
            max_height: 2000.0
            min_height: -2000.0
            biomes:
              - Plains
              - Forest              
        Shadows:
            name: "Shadows"
            enabled: true
            shadow_pass: false
            version: "1.0.0"
            type: "Shadows"
            dependencies:
              - ShaderManager
        Lighting:
            name: "LightService"
            enabled: true
            shadow_pass: false
            version: "1.0.0"
            type: "DirectionalLight"
            properties:
            ambient_light: [0.2, 0.2, 0.2]
            directional_light: [0.5, 0.7, 0.5]
            directional_light_color: [1.0, 1.0, 1.0, 1.0]
            shadows: true
            dependencies:
                - KeyboardManager
        Cycle:
            name: "CycleService"
            enabled: true
            version: "1.0.0"
            type: "DayNightCycle"
            day_night_cycle: true
            day_night_cycle_speed: 0.1
            dependencies:
                - World

        Chronos:
            name: "ChronosService"
            enabled: true
            version: "1.0.0"
            startDate: "01/08/2025 10:00:00"
            dependencies:
                - None

        Wheather:
            name: "WheatherService"
            enabled: true
            version: "1.0.0"
            type: "DynamicWeather"
            properties:
            rain_intensity: 0.3
            snow_intensity: 0.1
            fog_density: 0.2
Definition:
  Default:
    language: 1 # C++
    type: "Class"
    needs_register: true
    file_level: 3
    register_include: "REGISTER_CONFIG_TYPE"
    register_macro: "REGISTER_CONFIG_MACRO"
    interface_name: "ConfigService"
    class_suffix: "Config"
    class_prefix: ""
    inherits_properties:
        - type
        - enabled
        - mesh
        - shadow_pass
        - dependencies 
    #output_path: 'C:\Users\joaqu\source\repos\DirectX-Voxelado\TestConfig\Game\'
    output_path: 'c:\Users\joaqu\source\repos\DirectX-Voxelado\src\Engine\Core\Config\Game\'
