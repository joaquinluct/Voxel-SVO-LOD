Config:
  Services:
    Service:
      services_init:
          - Keyboard
          - KeyBindings
          - Mouse 
          - Material
          - UIText
          # - UIDebug
      services_render_order:
          - Mouse
          - Keyboard
          - UIText
          # - UIDebug
      services_update_order:
          - Mouse
          - Keyboard
          - UIText
          - Material
          # - UIDebug

    KeyBindings:
      enabled: true

    Keyboard:
      enabled: true
      dependencies:
        - KeyBindings

    Mouse:
      enabled: true
      dependencies:
        - RenderTargetManager
        - DeviceManager

    Material:
      enabled: true
      dependencies:
        - ShaderManager

    UIText:
      enabled: true
      dependencies:
        - DeviceManager

    UIBase:
      enabled: true
      texture: "TextureUI"
      shader: "ShaderUI"
      text: "User Interface"
      dependencies:
        - RenderTargetManager
        - DeviceManager
        - UIManager

    UIDebug:
      enabled: false
      texture: "TextureTextUI"
      shader: "ShaderTextUI"
      text: "Debug Information"
      dependencies:
        - UIManager

Definition:
  Default:
    language: 1 # C++
    type: "Class"
    needs_register: true
    file_level: 2
    register_include: "REGISTER_CONFIG_TYPE"
    register_macro: "REGISTER_CONFIG_MACRO"
    h_methods_template: ""
    interface_name: "ConfigService"
    class_suffix: "Config"
    class_prefix: ""
    inherits_properties:
      - type
      - enabled
      - texture
      - shader
      - text
      - dependencies
    #output_path: 'C:\Users\joaqu\source\repos\DirectX-Voxelado\TestConfig\Services\'
    output_path: 'c:\Users\joaqu\source\repos\DirectX-Voxelado\src\Engine\Core\Config\Services\'