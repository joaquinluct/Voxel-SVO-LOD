# assets_manifest.yaml
Config:
  Asset:
    Vertex:
      SkyboxCube:
        enabled: true
        type: "VertexAsset"
        name: "SkyboxCube"
        dependencies:
          - VertexAsset
      FloorVertex:
        enabled: true
        type: "VertexAsset"
        name: "FloorVertexDef"
        dependencies:
          - VertexAsset
Definition:
  Default:
    language: 1 # C++
    type: "Class"
    needs_register: true
    file_level: 3
    register_include: "REGISTER_CONFIG_TYPE"
    register_macro: "REGISTER_CONFIG_MACRO"
    interface_name: "VertexAssetConfigBase"
    class_suffix: "Config"
    class_prefix: ""
    inherits_properties:
        - name
        - type
        - dependencies
    # output_path: 'C:\Users\joaqu\source\repos\DirectX-Voxelado\TestConfig\Assets\'
    output_path: 'c:\Users\joaqu\source\repos\DirectX-Voxelado\src\Engine\Core\Config\Assets\'