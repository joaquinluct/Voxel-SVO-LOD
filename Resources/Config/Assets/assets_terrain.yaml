# assets_terrain.yaml
Config:
  Asset:
    Terrain:      
      ProceduralTerrain:
        enabled: true
        type: "TerrainAsset"
        meshType: 3 # Terrain
        name: "ProceduralTerrain"
        texture: "ProceduralTerrainTexture"        
        texture_transforms: [3.0, 3.0, 0.0, 0.0] # scale_x, scale_y, offset_x, offset_y
        # texture: "TextureGrassDiffuse"
        shader: "Terrain2Shader"
        # shader: "PBRShader"
        position: [0.0, 100.0, 0.0]
        cast_shadows: true
        receive_shadows: true
        shader_shadows: "ShadowMapShader"
        drawType: 1 # DrawIndexed
        # render_passes: 3 # shadow | color
        render_passes: 33 # shadow | terrain
        #render_passes: 2 # color
        dependencies:
          - ShaderManager
          - TerrainAsset          
          - Terrain2Shader
          - TerrainMesh 
Definition:
  Default:
    language: 1 # C++
    type: "Class"
    needs_register: true
    file_level: 3
    register_include: "REGISTER_CONFIG_TYPE"
    register_macro: "REGISTER_CONFIG_MACRO"
    interface_name: "TerrainAssetConfigBase"
    class_suffix: "Config"
    class_prefix: ""
    inherits_properties:
        - type
        - meshType
        - name
        - vertexDef
        - shader
        - definition
        - mesh_path
        - texture
        - texture_transforms
        - position 
        - textService
        - cast_shadows
        - receive_shadows
        - shader_shadows
        - drawType
        - render_passes
        - dependencies
    # output_path: 'C:\Users\joaqu\source\repos\DirectX-Voxelado\TestConfig\Assets\'
    output_path: 'c:\Users\joaqu\source\repos\DirectX-Voxelado\src\Engine\Core\Config\Assets\'
