# assets_texture.yaml
Config:
  Asset:
    Texture:
      TextureTextUI:
        type: "TextureAsset"
        map: "TextureTextUIMap"
        texture_desc: Texture2D_Simple_Jpg
        x_scale: 1.0
        y_scale: 1.0
        x_offset: 0.0
        y_offset: 0.0
        dependencies:
          - DeviceManager
          - TextureAsset
      TextureGrassDiffuse:
        type: "TextureAsset"
        map: "TextureGrassDiffuseMap"
        texture_desc: Texture2D_Simple_Jpg
        x_scale: 1.0
        y_scale: 1.0
        x_offset: 0.0
        y_offset: 0.0
        dependencies:
          - DeviceManager
          - TextureAsset 
      TextureBricks001:
        type: "TextureAsset"
        map: "TextureBricks001Map"
        texture_desc: Texture2D_Simple_Jpg
        x_scale: 1.0
        y_scale: 1.0
        x_offset: 0.0
        y_offset: 0.0
        dependencies:
          - DeviceManager
          - TextureAsset
      DefaultSkybox:
        type: "TextureAsset"
        map: "DefaultSkyboxMap"
        x_scale: 1.0
        y_scale: 1.0
        x_offset: 0.0
        y_offset: 0.0
        rotation_speed: 0.05 # Propiedad específica del skybox
        dependencies:
          - TextureAsset
      ProceduralTerrainTexture:
        type: "TextureAsset"
        map: "ProceduralTerrainTextureMap"
        texture_desc: Texture2D_Array_Jpg
        x_scale: 1.0
        y_scale: 1.0
        x_offset: 0.0
        y_offset: 0.0
        dependencies:
          - DeviceManager
          - TextureAsset
Definition:
  Default:
    language: 1 # C++
    type: "Class"
    needs_register: true
    file_level: 3
    register_include: "REGISTER_CONFIG_TYPE"
    register_macro: "REGISTER_CONFIG_MACRO"
    interface_name: "ITextureConfig"
    class_suffix: "Config"
    class_prefix: ""
    object_class:
        maps: ""
    inherits_properties:
        - type
        - definition
        - map
        - x_scale
        - y_scale
        - x_offset
        - y_offset
        - texture_desc
        - dependencies
    # output_path: 'C:\Users\joaqu\source\repos\DirectX-Voxelado\TestConfig\Assets\'
    output_path: 'c:\Users\joaqu\source\repos\DirectX-Voxelado\src\Engine\Core\Config\Assets\'