# assets_manifest.yaml
Config:
  Asset:
    Base:
      BaseIndex:
        index:
          - ShaderAsset
          - TextureAsset
          - VertexAsset
          - MeshAsset
      MainIndex:
        mainIndex:
          - SkyboxShader
          - DefaultShader
          - ShaderTextUI
          - TextureBasicShader
          - TextureMapShader
          - PBRShader
          - FloorVertex
          - FloorMesh
          - TextureTextUI
          - TextureGrassDiffuse
          - DefaultSkybox
          - SkyboxCube
          - SkyboxMesh
      MeshAsset:
        dependencies:
          - ShaderManager
          - DeviceManager
          - CameraManager
          - WorldMatrixManager
      ShaderAsset:
        dependencies:
          - DeviceManager
      TextureAsset:
        dependencies:
          - DeviceManager
      VertexAsset:
        dependencies:
          - DeviceManager

Definition:
  Default:
    language: 1 # C++
    type: "Class"
    needs_register: true
    file_level: 3
    register_include: "REGISTER_CONFIG_TYPE"
    register_macro: "REGISTER_CONFIG_MACRO"
    interface_name: "ConfigBase"
    class_suffix: "Config"
    class_prefix: ""
    inherits_properties:
        - type
        - definition
        - dependencies
    # output_path: 'C:\Users\joaqu\source\repos\DirectX-Voxelado\TestConfig\Assets\'
    output_path: 'c:\Users\joaqu\source\repos\DirectX-Voxelado\src\Engine\Core\Config\Assets\'