# assets_manifest.yaml
Config:
  Asset:
    Base:
      BaseIndex:
        index:
          - ShaderAsset
          - TextureAsset
          - VertexAsset
          - TerrainAsset
          - MeshAsset
          - UIAsset
        post_init:
          - none
      MainIndex:
        mainIndex:
          - ProceduralTerrain
          - SkyboxShader
          - ProceduralSkyboxShader
          - DefaultShader
          - ShaderTextUI
          - TextureBasicShader
          - ShadowMapShader
          - TextureMapShader
          - PBRShader
          - PBRShadowShader
          - FloorVertex
          - FloorMesh
          - House1Mesh
          - TextureTextUI
          - TextureGrassDiffuse
          - TextureBricks001
          - DefaultSkybox
          - SkyboxCube
          - SkyboxMesh
          - ProcSkyboxMesh
          - BoxMesh
          - UITextMesh
          - TerrainMesh
          - TerrainShader
          - Terrain2Shader
          - TerrainTessellation
          - ProceduralTerrainTexture          
          - OceanShader
          - OceanMesh
          - BlendingWaterPass
          # - WaterReflectionShader
          # - WaterRefractionShader
        post_init:
          - none
      MeshAsset:
        dependencies:
          - ShaderManager
          - DeviceManager
          - CameraManager          
      ShaderAsset:
        dependencies:
          - DeviceManager
      TextureAsset:
        dependencies:
          - DeviceManager
      VertexAsset:
        dependencies:
          - DeviceManager
      TerrainAsset:
        dependencies:
          - ShaderManager
          - DeviceManager
          - CameraManager
      UIAsset:
        dependencies:
          - ShaderManager
          - DeviceManager
          - CameraManager

Definition:
  Default:
    language: 1 # C++
    type: "Class"
    needs_register: true
    file_level: 3
    register_include: "REGISTER_CONFIG_TYPE"
    register_macro: "REGISTER_CONFIG_MACRO"
    interface_name: "ConfigBase"
    class_suffix: "Config"
    class_prefix: ""
    inherits_properties:
        - type
        - definition
        - dependencies
    # output_path: 'C:\Users\joaqu\source\repos\DirectX-Voxelado\TestConfig\Assets\'
    output_path: 'c:\Users\joaqu\source\repos\DirectX-Voxelado\src\Engine\Core\Config\Assets\'
