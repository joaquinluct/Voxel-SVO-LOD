# main_window_config.yaml
# Configuración de la ventana principal de la aplicación DirectX 12

Config:
  Application:
    Window:
      MainWindow:
        type: "MainWindowConfig"
        
        # Window properties
        title: "DirectX 12 Voxel Engine"
        width: 1920
        height: 1080
        fullscreen: false
        resizable: true
        vsync: true
        
        # Window style
        show_cursor: true
        allow_alt_f4: true
        show_in_taskbar: true
        
        # Performance settings
        max_delta_time: 0.052
        min_delta_time: 0.042
        target_fps: 60
        
        # Debug settings
        debug_window: true
        show_fps: false
        enable_debug_layer: true
        
        # Input settings
        capture_mouse: false
        raw_input: false
        
        dependencies:
          - None
          
      # Configuración de ventana para debug
      DebugWindow:
        type: "MainWindowConfig"
        
        title: "DirectX 12 Voxel Engine - Debug"
        width: 1280
        height: 720
        fullscreen: false
        resizable: true
        vsync: false
        
        show_cursor: true
        allow_alt_f4: true
        show_in_taskbar: true
        
        max_delta_time: 0.1
        min_delta_time: 0.016
        target_fps: 144
        
        debug_window: true
        show_fps: true
        enable_debug_layer: true
        
        capture_mouse: false
        raw_input: true
        
        dependencies:
          - None

Definition:
  Default:
    language: 1 # C++
    type: "Class"
    needs_register: true
    file_level: 3
    register_include: "REGISTER_CONFIG_TYPE"
    register_macro: "REGISTER_CONFIG_MACRO"
    interface_name: "IMainWindowConfig"
    class_suffix: "Config"
    class_prefix: ""
    inherits_properties:
        - type
        - title
        - width
        - height
        - fullscreen
        - resizable
        - vsync
        - show_cursor
        - allow_alt_f4
        - show_in_taskbar
        - max_delta_time
        - min_delta_time
        - target_fps
        - debug_window
        - show_fps
        - enable_debug_layer
        - capture_mouse
        - raw_input
        - dependencies
    output_path: 'C:\Users\joaqu\source\repos\DirectX-Voxelado\DX12\generated\Configs\'
